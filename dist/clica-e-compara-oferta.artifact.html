<title>Clica e Compara Ofertas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Clica e Compara — estilos.
   Segue o Manual de Marca v1.0: só tema claro, cores e fontes da marca.
   Layout: uma coluna de até 560px, pensada primeiro para o celular. */

:root {
  color-scheme: light;
  --azul-cobalto: #143A8C;   /* primária: confiança, dado */
  --coral: #E85D40;          /* alerta e destaque: o "flagra" (nunca texto, nunca botão primário) */
  --fundo-claro: #F7F9FD;    /* fundo da página */
  --branco: #FFFFFF;         /* cartões, campos, símbolo sobre azul */
  --tinta: #0B1210;          /* texto principal e símbolo preto */
  --tinta-suave: #4A525E;    /* texto secundário */
  --linha: #E4E9F5;          /* divisórias */
  --placeholder: #98A1B1;    /* texto de exemplo nos campos (nunca parece um valor) */
  --azul-hover: #123580;     /* azul com luminosidade 8% menor */
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --font-ui: "Manrope", system-ui, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--fundo-claro);
  color: var(--tinta);
  font: 400 16px/1.5 var(--font-ui);
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, select { font: inherit; color: inherit; }
h1, h2, h3, p, ul { margin: 0; padding: 0; }
ul { list-style: none; }

.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
.principal { display: flex; flex-direction: column; gap: 28px; }
.bloco { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
h2 { font: 700 18px/1.3 var(--font-ui); }
h3 { font: 700 15px/1.3 var(--font-ui); color: var(--tinta-suave); }

/* ---------- Cabeçalho ---------- */
.topo { display: flex; flex-direction: column; gap: 12px; }
.marca { display: flex; align-items: center; gap: 10px; font-size: 20px; }
.logo { color: var(--azul-cobalto); flex: none; }
.wordmark {
  font: 700 20px/1.2 var(--font-mono);
  color: var(--azul-cobalto);
  text-transform: uppercase;
  letter-spacing: 0.02em;
}
.apoio { max-width: 40ch; color: var(--tinta); font-weight: 500; }
.acoes { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- Botões ---------- */
.btn {
  min-height: 48px;
  padding: 0 18px;
  border-radius: 12px;
  border: 1.5px solid var(--azul-cobalto);
  font: 700 15px/1.2 var(--font-ui);
  cursor: pointer;
  transition: background-color .15s;
}
.btn.pri { background: var(--azul-cobalto); color: var(--branco); }
.btn.pri:hover, .btn.pri:active { background: var(--azul-hover); }
.btn.sec { background: var(--branco); color: var(--azul-cobalto); }
.btn.sec:hover, .btn.sec:active { background: var(--fundo-claro); }
.btn.cheio { width: 100%; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btns .btn { flex: 1 1 160px; }
.btn[hidden] { display: none; }

/* ---------- Campos ---------- */
.campo { display: flex; flex-direction: column; gap: 6px; }
label, legend { font: 600 14px/1.3 var(--font-ui); }
.field {
  width: 100%;
  min-height: 48px;
  background: var(--branco);
  border: 1.5px solid var(--tinta-suave);
  border-radius: 12px;
  padding: 0 14px;
  font: 500 16px/1.4 var(--font-ui);
  color: var(--tinta);
}
.field.num { font: 600 18px/1.4 var(--font-mono); }
.field::placeholder, .price::placeholder { color: var(--placeholder); font: 500 14px/1.4 var(--font-ui); opacity: 1; }
.dica { font-size: 13px; color: var(--tinta-suave); max-width: 65ch; }
.nota { font-size: 14px; color: var(--tinta-suave); max-width: 65ch; }

/* anel de foco duplo: 2px branco por dentro, 3px azul por fora */
:is(.field, .btn, summary, .del):focus-visible,
.money:focus-within,
.seg input:focus-visible + span {
  outline: 2px solid transparent;
  box-shadow: 0 0 0 2px var(--branco), 0 0 0 5px var(--azul-cobalto);
}

/* ---------- Cartão de embalagem ---------- */
.lista { display: flex; flex-direction: column; gap: 12px; }
.pkg {
  background: var(--branco);
  border: 1px solid var(--linha);
  border-radius: 16px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
}
.pkg-topo { display: flex; align-items: center; gap: 10px; }
.bolinha {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--azul-cobalto); color: var(--branco);
  display: grid; place-items: center;
  font: 700 15px/1 var(--font-mono);
  flex: none;
}
.pkg-nome { font-weight: 700; flex: 1; }
.del {
  width: 44px; height: 44px; border: 0; background: transparent; border-radius: 12px;
  display: grid; place-items: center; cursor: pointer; color: var(--tinta-suave); margin: -6px -6px -6px 0;
}
.del:hover { background: var(--fundo-claro); }
.del svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.dupla { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dupla > label { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

.money {
  display: flex; align-items: center; gap: 8px;
  min-height: 48px; padding: 0 12px;
  background: var(--branco);
  border: 1.5px solid var(--tinta-suave);
  border-radius: 12px;
}
.money i { font: 600 15px/1 var(--font-mono); font-style: normal; color: var(--tinta-suave); }
.pwrap { position: relative; flex: 1; min-width: 0; display: flex; align-items: center; }
.ghost {
  position: absolute; inset: 0; display: flex; align-items: center;
  font: 600 18px/1.4 var(--font-mono); white-space: pre; pointer-events: none; overflow: hidden;
}
.gv { visibility: hidden; }
.gs { color: var(--placeholder); }
.price {
  position: relative; width: 100%; min-width: 0; border: 0; padding: 0; background: transparent;
  font: 600 18px/1.4 var(--font-mono); color: var(--tinta); outline: none; height: 44px;
}
.dupla .field { padding: 0 12px; }

/* unidade: botões de escolha (g, kg, ml, L, unid.) */
.seg { border: 0; padding: 0; margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.seg-linha { display: flex; gap: 6px; }
.seg label { flex: 1; position: relative; display: block; font: inherit; }
.seg input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.seg span {
  display: grid; place-items: center; min-height: 44px; border-radius: 10px;
  background: var(--branco); border: 1.5px solid var(--tinta-suave); color: var(--tinta);
  font: 600 15px/1 var(--font-mono);
}
.seg input:checked + span { background: var(--azul-cobalto); border-color: var(--azul-cobalto); color: var(--branco); }

.mais summary { cursor: pointer; font: 600 14px/1.3 var(--font-ui); color: var(--azul-cobalto); min-height: 44px; display: flex; align-items: center; border-radius: 10px; }
.mais .conteudo { display: flex; flex-direction: column; gap: 6px; padding-top: 4px; }
.mais .field { max-width: 160px; }

/* ---------- Resultado ---------- */
.resultado { display: flex; flex-direction: column; gap: 16px; }
.vazio, .vazio-res {
  border: 1.5px dashed var(--tinta-suave); border-radius: 12px; padding: 16px; color: var(--tinta-suave); font-size: 15px;
}
.grupo { display: flex; flex-direction: column; gap: 10px; }
.best {
  background: var(--azul-cobalto); color: var(--branco); border-radius: 16px; padding: 18px;
  display: flex; flex-direction: column; gap: 6px;
}
.best.swap { animation: troca .24s ease-out; }
@keyframes troca { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.best .kicker { display: flex; align-items: center; gap: 10px; font: 700 14px/1.3 var(--font-ui); }
.best .kicker svg { color: var(--branco); flex: none; }
.best .nome { font: 600 16px/1.4 var(--font-mono); }
.best .preco { font: 700 clamp(40px, 13vw, 56px)/1.05 var(--font-mono); letter-spacing: -0.02em; margin-top: 4px; }
.best .preco small { font: 600 18px/1 var(--font-mono); letter-spacing: 0; margin-left: 4px; }
.best .eco { font-weight: 700; }
.best .det { font-size: 14px; font-weight: 500; }

.flagra {
  background: var(--branco); border: 1px solid var(--linha); border-left: 4px solid var(--coral);
  border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; color: var(--tinta);
}
.flagra svg { color: var(--coral); flex: none; }
.flagra strong { font-weight: 800; }

.ranking { display: flex; flex-direction: column; gap: 8px; }
.row {
  background: var(--branco); border: 1px solid var(--linha); border-radius: 12px; padding: 12px 14px;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: start;
}
.row .nome { font: 600 16px/1.4 var(--font-mono); overflow-wrap: anywhere; }
.row .det { font-size: 13px; color: var(--tinta-suave); }
.row .dir { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.row .val { font: 700 18px/1.2 var(--font-mono); white-space: nowrap; }
.row .val small { font: 500 13px/1 var(--font-mono); color: var(--tinta-suave); }
.selo {
  background: var(--coral); color: var(--tinta); font: 700 12px/1 var(--font-mono);
  padding: 5px 9px; border-radius: 999px; white-space: nowrap;
}

/* ---------- Salvar e histórico ---------- */
.editando { color: var(--azul-cobalto); font-weight: 600; }
.aviso { min-height: 22px; font-size: 14px; font-weight: 600; color: var(--azul-cobalto); opacity: 0; transition: opacity .2s; }
.aviso.on { opacity: 1; }

.hist { display: flex; flex-direction: column; gap: 12px; }
.hentry {
  background: var(--branco); border: 1px solid var(--linha); border-radius: 16px; padding: 14px;
  display: flex; flex-direction: column; gap: 4px;
}
.hentry.editando-item { border-color: var(--azul-cobalto); border-width: 1.5px; }
.h-titulo { font-weight: 800; overflow-wrap: anywhere; }
.h-onde { font-size: 14px; color: var(--tinta-suave); overflow-wrap: anywhere; }
.h-data { font-size: 13px; color: var(--tinta-suave); }
.h-melhor { font: 600 14px/1.4 var(--font-mono); margin-top: 4px; overflow-wrap: anywhere; }
.h-mudou { font-size: 13px; color: var(--tinta); border-left: 3px solid var(--linha); padding-left: 8px; margin-top: 2px; }
.h-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.h-btns .btn { flex: 1 1 120px; min-height: 44px; }

.rodape { font-size: 13px; color: var(--tinta-suave); text-align: center; padding-top: 8px; }

/* ---------- Utilitários ---------- */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* ---------- Impressão: fundo branco, sem botões, símbolo preto ---------- */
@media print {
  body { background: #fff; color: var(--tinta); }
  .acoes, .btn, .del, .salvar, .seg, .mais summary { display: none !important; }
  .logo, .best .kicker svg, .flagra svg { color: var(--tinta); }
  .best { background: #fff; color: var(--tinta); border: 2px solid var(--tinta); }
  .wordmark { color: var(--tinta); }
}

/* ---------- Variante Ofertas ---------- */
.pill-oferta {
  font: 700 12px/1 var(--font-mono); color: var(--azul-cobalto); text-transform: uppercase; letter-spacing: 0.04em;
  border: 1.5px solid var(--azul-cobalto); border-radius: 999px; padding: 5px 9px; margin-left: 2px;
}
.tres { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tres label { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field.invalido { border-color: var(--coral); }
.mais + .mais { margin-top: -4px; }
.copiar { display: flex; flex-direction: column; gap: 10px; }
.copiar textarea { padding: 12px 14px; min-height: 120px; font: 500 14px/1.5 var(--font-ui); resize: vertical; }
.row .loja { font-size: 13px; color: var(--tinta-suave); font-weight: 600; }
@media print { .copiar { display: none !important; } }
.promo-msg { color: var(--tinta); font-weight: 600; }
select.field { appearance: auto; padding-right: 10px; }
.mais .conteudo > label, .mais .conteudo .g-seg label { display: flex; flex-direction: column; gap: 6px; }
.mais .conteudo { gap: 10px; }
.mais .field { max-width: none; }
.mais .conteudo .dupla label { min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 44px; padding: 0 16px; border-radius: 999px; background: var(--branco);
  border: 1.5px solid var(--tinta-suave); color: var(--tinta); font: 600 14px/1 var(--font-ui); cursor: pointer;
}
.chip.on { background: var(--azul-cobalto); border-color: var(--azul-cobalto); color: var(--branco); }
.chip:focus-visible { outline: 2px solid transparent; box-shadow: 0 0 0 2px var(--branco), 0 0 0 5px var(--azul-cobalto); }

</style>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="cc-check" viewBox="190 190 680 550">
    <path d="M230 560 L400 700" fill="none" stroke="currentColor" stroke-width="70" stroke-linecap="round"/>
    <path d="M400 700 Q650 560 830 230" fill="none" stroke="currentColor" stroke-width="70" stroke-linecap="round"/>
  </symbol>
</svg>

<div class="wrap">
  <header class="topo">
    <h1 class="marca">
      <svg class="logo" width="35" height="28" aria-hidden="true"><use href="#cc-check"/></svg>
      <span class="wordmark">Clica e Compara</span>
      <span class="pill-oferta">Ofertas</span>
    </h1>
    <p class="apoio">Põe as ofertas que achou e vê qual compensa mais.</p>
    <p class="nota">Compara só o preço, não a qualidade. Marca e loja podem ser diferentes.</p>
    <div class="acoes">
      <button type="button" class="btn sec" id="exemplo">Vê um exemplo</button>
      <button type="button" class="btn sec" id="limpa">Limpa tudo</button>
    </div>
  </header>

  <main class="principal">
    <section class="bloco" aria-label="Produto">
      <div class="campo">
        <label for="produto">O que tá comparando?</label>
        <input id="produto" class="field" type="text" maxlength="80" autocomplete="off" placeholder="Sabão líquido">
      </div>
      <div class="campo">
        <label for="uso">Como medir o uso? (opcional)</label>
        <input id="uso" class="field" type="text" maxlength="20" autocomplete="off" placeholder="lavagem" aria-describedby="uso-dica">
        <div class="chips" id="chipsUso" role="group" aria-label="Sugestões de uso">
          <button type="button" class="chip" data-uso="lavagem">lavagem</button>
          <button type="button" class="chip" data-uso="folha">folha</button>
          <button type="button" class="chip" data-uso="metro">metro</button>
          <button type="button" class="chip" data-uso="porção">porção</button>
          <button type="button" class="chip" data-uso="dia">dia</button>
        </div>
        <p class="dica" id="uso-dica">Se cada oferta disser quantos usos rende, o app compara por uso. Toca numa sugestão ou escreve o seu.</p>
      </div>
    </section>

    <section class="bloco" aria-labelledby="t-emb">
      <h2 id="t-emb">Ofertas</h2>
      <div id="lista" class="lista"></div>
      <button type="button" class="btn sec cheio" id="add">Adiciona oferta</button>
    </section>

    <section class="bloco" aria-labelledby="t-res">
      <h2 id="t-res">Resultado</h2>
      <div id="resultado" class="resultado" aria-live="polite"></div>
      <div class="copiar" id="copiar" hidden>
        <button type="button" class="btn pri cheio" id="copia">Copia a oferta</button>
        <textarea id="copiaTexto" class="field" rows="5" readonly hidden aria-label="Texto pra colar no grupo"></textarea>
        <p class="aviso" id="aviso" role="status"></p>
      </div>
    </section>
  </main>

  <footer class="rodape">Uma empresa do Grupo Clix</footer>
</div>
<script>
/* Clica e Compara Ofertas — variante para comparar ofertas de marcas e lojas diferentes.
   Protótipo: sem banco de dados, sem histórico, sem envio de nada.
   Novidades em relação ao app principal:
   - marca e loja por oferta;
   - promoções: "leve X, pague Y", desconto na 2ª unidade, desconto extra (cartão) e cashback;
   - preço por uso (ex.: por lavagem), quando todas as ofertas dizem quantos usos rendem;
   - botão "Copia a oferta" com um texto curto pro WhatsApp. */
(function () {
  "use strict";

  const LETRAS = "ABCDEFGH";
  const MAX = 8, MIN = 2;

  const UNIDADES = {
    g:  { tipo: "massa",  f: 0.001, rotulo: "g" },
    kg: { tipo: "massa",  f: 1,     rotulo: "kg" },
    ml: { tipo: "volume", f: 0.001, rotulo: "ml" },
    L:  { tipo: "volume", f: 1,     rotulo: "L" },
    un: { tipo: "un",     f: 1,     rotulo: "unid." }
  };
  const TIPOS = {
    massa:  { titulo: "Peso",    por: "kg",      abrev: "kg",    cem: 10, rotuloCem: "100 g" },
    volume: { titulo: "Volume",  por: "litro",   abrev: "L",     cem: 10, rotuloCem: "100 ml" },
    un:     { titulo: "Unidade", por: "unidade", abrev: "unid.", cem: 0,  rotuloCem: "" }
  };

  /* ---------- Formatação (padrão brasileiro) ---------- */
  const brl2 = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL", minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const brl3 = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL", minimumFractionDigits: 3, maximumFractionDigits: 3 });
  // Abaixo de R$ 1,00 mostra 3 casas decimais
  const dinheiro = (v) => (v < 1 ? brl3 : brl2).format(v).replace(/ /g, " ");
  const fmtNum = (v) => v.toLocaleString("pt-BR", { maximumFractionDigits: 3 });

  function num(s) {
    s = String(s == null ? "" : s).trim().replace(/\s/g, "");
    if (!s) return NaN;
    if (s.indexOf(",") !== -1) s = s.replace(/\./g, "").replace(",", ".");
    else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");
    return parseFloat(s);
  }

  const $ = (sel) => document.querySelector(sel);
  function el(tag, cls, texto) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (texto != null) n.textContent = texto;
    return n;
  }
  const simbolo = (w, h) => '<svg width="' + w + '" height="' + h + '" aria-hidden="true"><use href="#cc-check"/></svg>';
  const limpaTexto = (s) => String(s || "").replace(/[\u0000-\u001F\u007F]/g, "").replace(/\s+/g, " ").trim().slice(0, 80);
  // Nome do "uso" (lavagem, folha, fralda...). Sem nome, vira "uso".
  const nomeUso = () => limpaTexto($("#uso").value).slice(0, 20).toLowerCase() || "uso";

  /* ---------- Estado ---------- */
  let proxId = 1;
  let pkgs = [];
  let ultimo = [];                   // grupos do último resultado (usado pelo "Copia a oferta")
  const ultimoMelhor = {};

  const novaPkg = (o) => Object.assign({
    id: proxId++, nome: "", loja: "", preco: "", qtd: "", unidade: "g", itens: "", usos: "",
    promo: "",               // "", "lp" (leve/pague) ou "seg" (desconto na 2ª unidade)
    leve: "", pague: "", seg: "", desc: "", cash: ""
  }, o || {});

  /* ---------- Campo de preço (mesma máscara do app principal) ---------- */
  function limpaPreco(bruto) {
    const s = String(bruto).replace(/\./g, ",").replace(/[^\d,]/g, "");
    const i = s.indexOf(",");
    let inteiro = s, dec = null;
    if (i !== -1) {
      inteiro = s.slice(0, i);
      dec = s.slice(i + 1).replace(/,/g, "").slice(0, 2);
    }
    if (dec === null && /^0\d/.test(inteiro)) {
      dec = inteiro.slice(1, 3);
      inteiro = "0";
    } else {
      inteiro = inteiro.replace(/^0+(?=\d)/, "");
    }
    inteiro = inteiro.slice(0, 6);
    return dec === null ? inteiro : (inteiro || "0") + "," + dec;
  }
  const fmtPreco = (v) => (v > 0 ? v.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "");
  function fantasma(v) {
    if (!v) return "";
    const i = v.indexOf(",");
    if (i === -1) return ",00";
    return ["00", "0", ""][v.length - i - 1] || "";
  }
  function atualizaFantasma(input) {
    const g = input.parentNode.querySelector(".ghost");
    if (!g) return;
    g.querySelector(".gv").textContent = input.value;
    g.querySelector(".gs").textContent = fantasma(input.value);
  }

  /* ---------- Cartões das ofertas ---------- */
  const UNID_ORDEM = ["g", "kg", "ml", "L", "un"];

  function montaCartoes() {
    const lista = $("#lista");
    lista.textContent = "";
    pkgs.forEach((p, i) => {
      const L = LETRAS[i];
      p.preco = fmtPreco(num(p.preco));
      const a = el("article", "pkg");
      a.dataset.id = p.id;
      const unidades = UNID_ORDEM.map((u) =>

  // Sugestões de uso: o exemplo do campo muda conforme o uso escolhido
  const EXEMPLOS_USO = {
    "lavagem": "sabão que rende 40 lavagens",
    "folha": "papel toalha com 120 folhas",
    "metro": "papel higiênico com 30 metros",
    "porção": "café que rende 50 porções",
    "dia": "ração que dura 30 dias"
  };
  function atualizaDicasUso() {
    const n = nomeUso();
    const ex = EXEMPLOS_USO[n];
    const texto = ex
      ? "Exemplo: " + ex + ". Põe só o número. Se todas as ofertas tiverem esse número, o app compara por " + n + "."
      : "Põe quantos " + n + " a embalagem rende, só o número. Se todas as ofertas tiverem, o app compara por " + n + ".";
    document.querySelectorAll(".usos-dica").forEach((d) => { d.textContent = texto; });
    document.querySelectorAll("#chipsUso .chip").forEach((c) => {
      const on = c.dataset.uso === n && limpaTexto($("#uso").value) !== "";
      c.setAttribute("aria-pressed", on ? "true" : "false");
      c.classList.toggle("on", on);
    });
  }
  function aoMudarUso() { atualizaDicasUso(); mostraResultado(); }

  function acharPkg(no) {
    const a = no.closest(".pkg");
    if (!a) return null;
    const id = Number(a.dataset.id);
    return pkgs.find((p) => p.id === id) || null;
  }

  /* ---------- Promoção ----------
     preço efetivo da embalagem = preço × fator − cashback
     - leve X, pague Y:       fator × (Y ÷ X)
     - 2ª unidade com D% off: fator × (1 − D ÷ 200)   (comprando duas, a média cai D/2 %)
     - desconto extra E%:     fator × (1 − E ÷ 100)
     - cashback R$ C:         tira C de cada embalagem
     Promoção inválida é ignorada e a pessoa é avisada no próprio cartão. */
  function promo(p, preco) {
    let fator = 1, cash = 0;
    const textos = [], erros = {};
    if (p.promo === "lp") {
      const leve = p.leve === "" ? NaN : Number(p.leve);
      const pague = p.pague === "" ? NaN : Number(p.pague);
      if (p.leve === "" && p.pague === "") {
        // ainda não preencheu: nada a aplicar
      } else if (Number.isInteger(leve) && Number.isInteger(pague) && leve >= 2 && pague >= 1 && pague < leve) {
        fator *= pague / leve;
        textos.push("Leve " + leve + ", pague " + pague);
      } else {
        erros.lp = "Pra valer, leve precisa ser maior que pague. Ex.: leve 3, pague 2.";
      }
    } else if (p.promo === "seg" && p.seg !== "") {
      const d = num(p.seg);
      if (d > 0 && d <= 100) {
        fator *= 1 - d / 200;
        textos.push(fmtNum(d) + "% na 2ª unidade, comprando 2");
      } else {
        erros.seg = "O desconto da 2ª unidade tem que ficar entre 0 e 100%.";
      }
    }
    if (p.desc !== "") {
      const d = num(p.desc);
      if (d > 0 && d < 100) {
        fator *= 1 - d / 100;
        textos.push(fmtNum(d) + "% de desconto extra");
      } else {
        erros.desc = "O desconto extra tem que ficar entre 0 e 100%.";
      }
    }
    if (p.cash !== "") {
      const c = num(p.cash);
      if (c > 0 && (!(preco > 0) || preco * fator - c > 0)) {
        cash = c;
        textos.push(dinheiro(c) + " de cashback");
      } else {
        erros.cash = "O cashback precisa ser maior que zero e menor que o preço.";
      }
    }
    const msg = erros.lp || erros.seg || erros.desc || erros.cash || "";
    return { fator, cash, erros, msg, texto: textos.join(" + ") };
  }

  // Mostra só os campos do tipo de promoção escolhido e marca os campos com erro
  function atualizaPromoUI(cartao, p) {
    cartao.querySelector(".g-lp").hidden = p.promo !== "lp";
    cartao.querySelector(".g-seg").hidden = p.promo !== "seg";
    const r = promo(p, num(p.preco));
    const m = cartao.querySelector(".promo-msg");
    m.textContent = r.msg;
    m.hidden = !r.msg;
    cartao.querySelector(".leve").classList.toggle("invalido", !!r.erros.lp);
    cartao.querySelector(".pague").classList.toggle("invalido", !!r.erros.lp);
    cartao.querySelector(".seg2").classList.toggle("invalido", !!r.erros.seg);
    cartao.querySelector(".desc").classList.toggle("invalido", !!r.erros.desc);
    cartao.querySelector(".cash").classList.toggle("invalido", !!r.erros.cash);
  }

  const soDigitos = (v, n) => v.replace(/\D/g, "").slice(0, n);
  const soDecimal = (v, n) => v.replace(/[^\d.,]/g, "").slice(0, n);

  function aoMudar(e) {
    const p = acharPkg(e.target);
    if (!p) return;
    const t = e.target;
    const c = t.classList;
    const campoLimpo = (chave, valor) => { p[chave] = valor; if (t.value !== valor) t.value = valor; };
    if (c.contains("price")) {
      const limpo = limpaPreco(t.value);
      if (t.value !== limpo) {
        t.value = limpo;
        try { t.setSelectionRange(limpo.length, limpo.length); } catch (err) {}
      }
      p.preco = limpo;
      atualizaFantasma(t);
    } else if (c.contains("qty")) campoLimpo("qtd", soDecimal(t.value, 10));
    else if (c.contains("items")) campoLimpo("itens", soDigitos(t.value, 4));
    else if (c.contains("usos")) campoLimpo("usos", soDecimal(t.value, 8));
    else if (c.contains("leve")) campoLimpo("leve", soDigitos(t.value, 3));
    else if (c.contains("pague")) campoLimpo("pague", soDigitos(t.value, 3));
    else if (c.contains("seg2")) campoLimpo("seg", soDecimal(t.value, 5));
    else if (c.contains("desc")) campoLimpo("desc", soDecimal(t.value, 5));
    else if (c.contains("cash")) campoLimpo("cash", soDecimal(t.value, 9));
    else if (c.contains("promo-tipo")) p.promo = t.value;
    else if (c.contains("nome")) p.nome = t.value;
    else if (c.contains("loja")) p.loja = t.value;
    else if (t.type === "radio") p.unidade = t.value;
    atualizaPromoUI(t.closest(".pkg"), p);
    mostraResultado();
  }

  const lista = $("#lista");
  lista.addEventListener("input", aoMudar);
  lista.addEventListener("change", aoMudar);

  lista.addEventListener("paste", (e) => {
    const t = e.target;
    if (!t.classList || !t.classList.contains("price")) return;
    const v = num((e.clipboardData || window.clipboardData).getData("text").replace(/[^\d.,]/g, ""));
    if (!(v > 0)) return;
    e.preventDefault();
    t.value = String(Math.round(v * 100) / 100).replace(".", ",");
    t.dispatchEvent(new Event("input", { bubbles: true }));
  });

  let primeiroToque = null;
  lista.addEventListener("focusin", (e) => {
    const t = e.target;
    if (!t.classList || !t.classList.contains("price")) return;
    t.value = t.value.replace(/\./g, "");
    const p = acharPkg(t);
    if (p) p.preco = t.value;
    atualizaFantasma(t);
    primeiroToque = t;
    const valorAoFocar = t.value;
    setTimeout(() => {
      if (t.value !== valorAoFocar) return;
      try { t.select(); } catch (err) {}
    }, 0);
  });
  lista.addEventListener("mouseup", (e) => { if (e.target === primeiroToque) e.preventDefault(); });
  lista.addEventListener("click", (e) => {
    if (e.target === primeiroToque) {
      try { e.target.select(); } catch (err) {}
      primeiroToque = null;
    }
  });
  lista.addEventListener("focusout", (e) => {
    const t = e.target;
    if (!t.classList || !t.classList.contains("price")) return;
    const v = fmtPreco(num(t.value));
    t.value = v;
    const p = acharPkg(t);
    if (p) p.preco = v;
    atualizaFantasma(t);
    atualizaPromoUI(t.closest(".pkg"), p);
    mostraResultado();
  });

  lista.addEventListener("click", (e) => {
    const b = e.target.closest(".del");
    if (!b) return;
    const p = acharPkg(b);
    if (!p || pkgs.length <= MIN) return;
    pkgs = pkgs.filter((x) => x !== p);
    montaCartoes();
    mostraResultado();
  });
  $("#add").addEventListener("click", () => {
    if (pkgs.length >= MAX) return;
    pkgs.push(novaPkg());
    montaCartoes();
    const cartoes = document.querySelectorAll(".pkg");
    cartoes[cartoes.length - 1].querySelector(".nome").focus();
    mostraResultado();
  });

  function recomeca(produto, uso) {
    pkgs = [novaPkg(), novaPkg()];
    $("#produto").value = produto || "";
    $("#uso").value = uso || "";
    aviso("");
    esconderTexto();
    montaCartoes();
    mostraResultado();
  }
  $("#limpa").addEventListener("click", () => recomeca("", ""));
  $("#exemplo").addEventListener("click", () => {
    recomeca("Sabão líquido", "lavagem");
    Object.assign(pkgs[0], { nome: "OMO", loja: "Pão de Açúcar", preco: "19,90", qtd: "3", unidade: "L" });
    Object.assign(pkgs[1], { nome: "Becker", loja: "Mercado do bairro", preco: "29,90", qtd: "5", unidade: "L" });
    montaCartoes();
    mostraResultado();
  });
  $("#produto").addEventListener("input", esconderTexto);
  $("#uso").addEventListener("input", aoMudarUso);
  // Tocar numa sugestão preenche o campo; tocar de novo na mesma limpa
  $("#chipsUso").addEventListener("click", (e) => {
    const c = e.target.closest(".chip");
    if (!c) return;
    const campo = $("#uso");
    campo.value = limpaTexto(campo.value).toLowerCase() === c.dataset.uso ? "" : c.dataset.uso;
    aoMudarUso();
  });

  /* ---------- Cálculo ---------- */
  // Preço por unidade base = preço efetivo ÷ (quantidade × itens × fator da unidade)
  // Custo por uso = preço efetivo ÷ usos por embalagem (só quando a pessoa informa os usos)
  function calcula(lista) {
    return lista.map((p, i) => {
      const preco = num(p.preco);
      const qtd = num(p.qtd);
      const itens = p.itens === "" ? 1 : num(p.itens);
      const u = UNIDADES[p.unidade];
      const ok = preco > 0 && qtd > 0 && Number.isInteger(itens) && itens >= 1 && isFinite(preco * qtd * itens);
      const pr = promo(p, preco);
      // promoção com erro é ignorada (fator 1, sem cashback)
      const fator = pr.msg ? 1 : pr.fator;
      const cash = pr.msg ? 0 : pr.cash;
      const efetivo = ok ? Math.max(preco * fator - cash, 0.01) : 0;
      const total = ok ? qtd * itens * u.f : 0;
      const usos = p.usos === "" ? NaN : num(p.usos);
      return {
        letra: LETRAS[i], ok, preco, efetivo, promoTexto: pr.msg ? "" : pr.texto,
        qtd, itens, unidade: p.unidade, tipo: u.tipo, total,
        usos: usos > 0 ? usos : 0,
        marca: limpaTexto(p.nome), loja: limpaTexto(p.loja),
        up: ok ? efetivo / total : null,
        ref: null                       // valor usado pra comparar (por unidade base ou por uso)
      };
    });
  }
  const textoQtd = (r) => fmtNum(r.qtd) + " " + UNIDADES[r.unidade].rotulo + (r.itens > 1 ? " x " + r.itens : "");
  const nomeDe = (r) => (r.marca || "Oferta " + r.letra) + ", " + textoQtd(r);
  const nomeComLoja = (r) => nomeDe(r) + (r.loja ? " (" + r.loja + ")" : "");

  // Contexto de comparação do grupo: por unidade base (kg, L, unid.) ou por uso (lavagem...)
  function contextoDe(modo, tipo) {
    const t = TIPOS[tipo];
    return modo === "uso" ? { por: nomeUso(), abrev: nomeUso() } : { por: t.por, abrev: t.abrev };
  }

  function detalhe(r, modo) {
    const t = TIPOS[r.tipo];
    const partes = [textoQtd(r) + " por " + dinheiro(r.preco) + "."];
    if (r.promoTexto) partes.push(r.promoTexto + ": cada uma sai " + dinheiro(r.efetivo) + ".");
    if (r.usos) {
      partes.push(modo === "uso"
        ? dinheiro(r.up) + " por " + t.abrev + "."
        : dinheiro(r.efetivo / r.usos) + " por " + nomeUso() + ".");
    }
    if (t.cem) partes.push(dinheiro(r.up / t.cem) + " por " + t.rotuloCem + ".");
    return partes.join(" ");
  }

  /* ---------- Resultado ---------- */
  function cartaoMelhor(arr, empate, modo) {
    const cx = contextoDe(modo, arr[0].tipo);
    const melhor = arr[0];
    const pior = arr[arr.length - 1];
    const c = el("div", "best");
    const k = el("p", "kicker");
    k.innerHTML = simbolo(30, 24);
    k.appendChild(el("span", "", empate ? "Empate" : "Melhor compra"));
    c.appendChild(k);
    c.appendChild(el("p", "nome", empate ? nomeDe(melhor) + " e " + nomeDe(arr[1]) : nomeDe(melhor)));
    if (!empate && melhor.loja) c.appendChild(el("p", "det", melhor.loja));
    const p = el("p", "preco", dinheiro(melhor.ref));
    p.appendChild(el("small", "", "/" + cx.abrev));
    c.appendChild(p);
    if (empate) {
      c.appendChild(el("p", "eco", "O preço por " + cx.por + " é praticamente o mesmo. Leva a que for mais útil."));
    } else {
      c.appendChild(el("p", "eco", dinheiro(pior.ref - melhor.ref) + " a menos por " + cx.por + " que a mais cara"));
      c.appendChild(el("p", "det", detalhe(melhor, modo)));
    }
    const chave = (empate ? "e" : "m") + melhor.letra + modo;
    const memo = ultimoMelhor[melhor.tipo];
    if (memo && memo.chave !== chave) ultimoMelhor[melhor.tipo] = { chave, quando: Date.now() };
    else if (!memo) ultimoMelhor[melhor.tipo] = { chave, quando: 0 };
    if (Date.now() - ultimoMelhor[melhor.tipo].quando < 400) c.classList.add("swap");
    return c;
  }

  // "% mais caro" = (valor da oferta ÷ valor da melhor compra − 1) × 100, mínimo 1%
  const pctMaisCaro = (r, melhor) => Math.max(1, Math.round((r.ref / melhor.ref - 1) * 100));

  function linha(r, melhor, modo) {
    const cx = contextoDe(modo, r.tipo);
    const li = el("li", "row");
    const esq = el("div");
    esq.appendChild(el("p", "nome", nomeDe(r)));
    if (r.loja) esq.appendChild(el("p", "loja", r.loja));
    esq.appendChild(el("p", "det", detalhe(r, modo)));
    const dir = el("div", "dir");
    const v = el("p", "val", dinheiro(r.ref));
    v.appendChild(el("small", "", "/" + cx.abrev));
    dir.appendChild(v);
    dir.appendChild(el("span", "selo", pctMaisCaro(r, melhor) + "% mais caro"));
    li.appendChild(esq);
    li.appendChild(dir);
    return li;
  }

  function grupoResultado(arr, vario) {
    const sec = el("section", "grupo");
    if (vario) sec.appendChild(el("h3", "", TIPOS[arr[0].tipo].titulo));
    if (arr.length < 2) {
      sec.appendChild(el("p", "vazio-res", "Põe outra oferta do mesmo tipo pra comparar."));
      return sec;
    }
    // Por uso só quando TODAS as ofertas do grupo dizem quantos usos rendem
    const modo = arr.every((r) => r.usos > 0) ? "uso" : "base";
    arr.forEach((r) => { r.ref = modo === "uso" ? r.efetivo / r.usos : r.up; });
    arr.sort((a, b) => a.ref - b.ref);
    const melhor = arr[0];
    // Empate: diferença entre as duas mais baratas menor que 0,5%
    const empate = arr[1].ref / melhor.ref - 1 < 0.005;
    const cx = contextoDe(modo, melhor.tipo);
    if (modo === "base" && arr.some((r) => r.usos > 0)) {
      sec.appendChild(el("p", "nota", "Põe os usos de todas as ofertas pra comparar por " + nomeUso() + "."));
    }
    sec.appendChild(cartaoMelhor(arr, empate, modo));

    // Flagra: a embalagem de maior quantidade total não é a melhor compra
    const maior = arr.reduce((m, r) => (r.total > m.total ? r : m), arr[0]);
    const flagra = !empate && maior !== melhor && maior.ref / melhor.ref - 1 >= 0.005;
    if (flagra) {
      const f = el("div", "flagra");
      f.innerHTML = simbolo(25, 20);
      const txt = el("p");
      txt.innerHTML = "<strong>Flagra:</strong> ";
      txt.appendChild(document.createTextNode("a embalagem maior sai mais cara por " + cx.por + "."));
      f.appendChild(txt);
      sec.appendChild(f);
    }
    const ul = el("ul", "ranking");
    arr.slice(empate ? 2 : 1).forEach((r) => ul.appendChild(linha(r, melhor, modo)));
    if (ul.children.length) sec.appendChild(ul);
    ultimo.push({ arr, empate, flagra, modo });
    return sec;
  }

  function mostraResultado() {
    const box = $("#resultado");
    box.textContent = "";
    ultimo = [];
    const validas = calcula(pkgs).filter((r) => r.ok);
    if (!validas.length) {
      box.appendChild(el("p", "vazio-res", "Preenche o preço e a quantidade de pelo menos duas ofertas. O resultado aparece aqui."));
    } else {
      const grupos = ["massa", "volume", "un"].map((t) => validas.filter((r) => r.tipo === t)).filter((a) => a.length);
      const vario = grupos.length > 1;
      if (vario) box.appendChild(el("p", "nota", "Peso, volume e unidade não se misturam. Cada tipo foi comparado separado."));
      grupos.forEach((arr) => box.appendChild(grupoResultado(arr, vario)));
    }
    $("#copiar").hidden = ultimo.length === 0;
    esconderTexto();
  }

  /* ---------- Copia a oferta ---------- */
  // Monta um texto curto, sem emoji, pra colar no WhatsApp
  function textoGrupo() {
    const produto = limpaTexto($("#produto").value);
    const linhas = ["Clica e Compara" + (produto ? ": " + produto : "")];
    ultimo.forEach((g) => {
      const cx = contextoDe(g.modo, g.arr[0].tipo);
      const melhor = g.arr[0];
      if (g.empate) {
        linhas.push("Empate: " + nomeComLoja(melhor) + " e " + nomeComLoja(g.arr[1]) + ", a " + dinheiro(melhor.ref) + "/" + cx.abrev);
      } else {
        linhas.push("Melhor compra: " + nomeComLoja(melhor) + ", a " + dinheiro(melhor.ref) + "/" + cx.abrev);
        if (melhor.promoTexto) linhas.push("(com promoção: " + melhor.promoTexto + ")");
        g.arr.slice(1).forEach((r) => {
          linhas.push(nomeComLoja(r) + ": " + dinheiro(r.ref) + "/" + cx.abrev + ", " + pctMaisCaro(r, melhor) + "% mais caro");
        });
        if (g.flagra) linhas.push("Flagra: a embalagem maior sai mais cara por " + cx.por + ".");
      }
    });
    linhas.push("Compara só o preço, não a qualidade.");
    return linhas.join("\n");
  }

  let avisoTimer = null;
  function aviso(texto) {
    const a = $("#aviso");
    clearTimeout(avisoTimer);
    a.textContent = texto;
    a.classList.toggle("on", !!texto);
    if (texto) avisoTimer = setTimeout(() => a.classList.remove("on"), 4500);
  }
  function esconderTexto() { $("#copiaTexto").hidden = true; }

  $("#copia").addEventListener("click", () => {
    const texto = textoGrupo();
    const area = $("#copiaTexto");
    area.value = texto;
    // Plano B: se o navegador não deixar copiar, mostra o texto já selecionado
    const mostra = () => {
      area.hidden = false;
      area.focus();
      area.select();
      aviso("Não deu pra copiar sozinho. Seleciona o texto e copia.");
    };
    try {
      navigator.clipboard.writeText(texto).then(() => aviso("Copiou. Cola no grupo."), mostra);
    } catch (e) { mostra(); }
  });

  /* ---------- Início ---------- */
  pkgs = [novaPkg(), novaPkg()];
  montaCartoes();
  mostraResultado();
})();

</script>
