<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clica e Compara Ofertas</title>
<meta name="description" content="Põe as ofertas que achou e vê qual compensa mais.">
<meta name="theme-color" content="#143A8C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='190 190 680 550'%3E%3Cg fill='none' stroke='%23143A8C' stroke-width='70' stroke-linecap='round'%3E%3Cpath d='M230 560 L400 700'/%3E%3Cpath d='M400 700 Q650 560 830 230'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--APP-START-->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="cc-check" viewBox="190 190 680 550">
    <path d="M230 560 L400 700" fill="none" stroke="currentColor" stroke-width="70" stroke-linecap="round"/>
    <path d="M400 700 Q650 560 830 230" fill="none" stroke="currentColor" stroke-width="70" stroke-linecap="round"/>
  </symbol>
</svg>

<div class="wrap">
  <header class="topo">
    <h1 class="marca">
      <svg class="logo" width="35" height="28" aria-hidden="true"><use href="#cc-check"/></svg>
      <span class="wordmark">Clica e Compara</span>
      <span class="pill-oferta">Ofertas</span>
    </h1>
    <p class="apoio">Põe as ofertas que achou e vê qual compensa mais.</p>
    <p class="nota">Compara só o preço, não a qualidade. Marca e loja podem ser diferentes.</p>
    <div class="acoes">
      <button type="button" class="btn sec" id="exemplo">Vê um exemplo</button>
      <button type="button" class="btn sec" id="limpa">Limpa tudo</button>
    </div>
  </header>

  <main class="principal">
    <section class="bloco" aria-label="Produto">
      <div class="campo">
        <label for="produto">O que tá comparando?</label>
        <input id="produto" class="field" type="text" maxlength="80" autocomplete="off" placeholder="Sabão líquido">
      </div>
      <div class="campo">
        <label for="uso">Como medir o uso? (opcional)</label>
        <input id="uso" class="field" type="text" maxlength="20" autocomplete="off" placeholder="lavagem" aria-describedby="uso-dica">
        <div class="chips" id="chipsUso" role="group" aria-label="Sugestões de uso">
          <button type="button" class="chip" data-uso="lavagem">lavagem</button>
          <button type="button" class="chip" data-uso="folha">folha</button>
          <button type="button" class="chip" data-uso="metro">metro</button>
          <button type="button" class="chip" data-uso="porção">porção</button>
          <button type="button" class="chip" data-uso="dia">dia</button>
        </div>
        <p class="dica" id="uso-dica">Se cada oferta disser quantos usos rende, o app compara por uso. Toca numa sugestão ou escreve o seu.</p>
      </div>
    </section>

    <section class="bloco" aria-labelledby="t-emb">
      <h2 id="t-emb">Ofertas</h2>
      <div id="lista" class="lista"></div>
      <button type="button" class="btn sec cheio" id="add">Adiciona oferta</button>
    </section>

    <section class="bloco" aria-labelledby="t-res">
      <h2 id="t-res">Resultado</h2>
      <div id="resultado" class="resultado" aria-live="polite"></div>
      <div class="copiar" id="copiar" hidden>
        <button type="button" class="btn pri cheio" id="copia">Copia a oferta</button>
        <textarea id="copiaTexto" class="field" rows="5" readonly hidden aria-label="Texto pra colar no grupo"></textarea>
        <p class="aviso" id="aviso" role="status"></p>
      </div>
    </section>
  </main>

  <footer class="rodape">Uma empresa do Grupo Clix</footer>
</div>
<!--APP-END-->
<script src="app.js"></script>
</body>
</html>
